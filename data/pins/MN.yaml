# Minnesota map pins — county courthouses (50-state wave, 2026-09-21).
# All 87 Minnesota counties are covered (no omissions).
# Addresses and court-page URLs verified 2026-09-21 through official search-
# indexed pages on mncourts.gov (Minnesota Judicial Branch) or official county
# domains; direct mncourts.gov page fetches were Cloudflare-blocked, so page URLs
# are the exact indexed official URLs, preserved verbatim (including path case).
# County names copied verbatim from data/states/MN.yaml.
# Coordinates are Nominatim (OpenStreetMap) matches for each official address,
# geocoded 2026-09-21 with user-agent 'TicketRouter/1.0 (open-source civic
# directory)', 1+ second between requests, retried until resolved. Every result
# was cross-checked against the address city, county, and Minnesota; all pins
# sit in the expected city/county except where noted below.
# Caveats:
# - St. Louis County operates full-service court offices in Duluth, Hibbing,
#   and Virginia; the Duluth courthouse is used as this county's single pin.
# - Le Sueur: court now sits in the Justice Center (435 E Derrynane St); the
#   former courthouse at 88 S Park Ave is now the county Government Center.
# - Wright: official page now lists the Justice Center (3700 Braddock Ave NE)
#   rather than the historic 10 2nd St NW address.
# - Mower: no HTTPS mncourts.gov county page was indexable; pin uses the
#   official Mower County directory URL (www.co.mower.mn.us).
# - Pipestone: indexed official pages disagree on ZIP (56156 vs 56164); pin
#   uses 56164 from the district-court page.
# - Stearns: uses the court-administration address (725 Courthouse Square)
#   among the county's several court-service locations.
# - Big Stone, Grant, Mower, St. Louis: Nominatim has no house-number data,
#   so coordinates are street-level (the correct street in the right city).
# - Benton: Nominatim places 615 Highway 23 in adjacent Gilmanton Township
#   (Foley 56329), Benton County — same county, township naming only.
# - Dakota: 1560 W Highway 55 is not indexed; coordinates are for the named
#   Dakota County Government Center in Hastings (Nominatim labels the West
#   4th Street side of the same complex).
# - Polk: Nominatim labels 816 Marin Avenue, Crookston as the Northwest
#   Regional Corrections Center (shared county building); official address
#   retained.
# - Wabasha: coordinates are for the Wabasha County Courthouse POI at 625
#   Jefferson Avenue (Nominatim had no match for the official 848 17th Street
#   East Suite 4 address); official address retained.
# - Jackson, Lac qui Parle: free-text address queries mis-resolved out of
#   state (South Carolina / Nebraska); coordinates are for the named county
#   courthouse POIs in the correct Minnesota city/county.
# - Itasca, Morrison: address matches are interpolated along the street
#   (Nominatim labels a nearby mobile-home court); city/county verified.
# - Coordinates are building-level where available, not survey-grade.
