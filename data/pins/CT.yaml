# Connecticut map pins — Superior Court Geographical Area (GA) courthouses
# (50-state wave, 2026-09-21).
# CONNECTICUT QUIRK: Connecticut abolished county government — there are no
# county courts. Traffic venue is the Superior Court Geographical Area (GA)
# determined by the town where the matter arose. This file pins ONE
# representative GA courthouse per county area (the representative GAs named
# in data/states/CT.yaml): Fairfield->GA2 Bridgeport, Hartford->GA14 Hartford,
# Litchfield->GA18 Torrington, Middlesex->GA9 Middletown, New Haven->GA23 New
# Haven, New London->GA10 New London, Tolland->GA19 Rockville, Windham->GA11
# Danielson.
# Verification method: jud.ct.gov was unreachable via curl (HTTP 000, empty
# reply from server on both https://www.jud.ct.gov/ and https://jud.ct.gov/).
# All 8 pin URLs were live-verified via browser_open fetches on 2026-09-21 —
# each page rendered the expected official "CT Judicial Branch" court content
# including the courthouse name and street address. Street addresses are from
# the official courthouse directory (www.jud.ct.gov/directory/courthouses.htm)
# and the per-GA directions pages. Coordinates are FULL_ADDRESS-level
# Nominatim matches in the correct Connecticut city, cross-checked against the
# official address. Pin URLs are the official per-GA directions pages.
# No county areas omitted — all 8 have pins.
# Caveats:
# - Hosts: all pin URLs use www.jud.ct.gov, which IS in data/states/CT.yaml's
#   official_hosts (added 2026-09-21); scripts/validate.mjs passes.
#   The Judicial Branch site is the only official source of courthouse
#   addresses; portal.ct.gov has no equivalent court directory page.
# - Torrington GA18: the courthouse directions page gives "50 Field Street,
#   Torrington 06790"; the directory index page lists 06760. The pin uses
#   06790 (courthouse-specific page + Nominatim agree). The GA18 directions
#   page lives at the odd path .../directions/Juvenile/torrington.htm — this is
#   the link the official directory serves for GA18, verified live.
# - New Haven GA23: the official directory links GA23's directions to the
#   .../directions/6.htm path (numbering quirk on the Judicial Branch site);
#   verified live with the "Geographical Area 23 at New Haven" heading and
#   address, so the URL is used verbatim.
# - New London GA10: pin is the GA courthouse at 112 Broad Street (official
#   page coordinates 41.35759, -72.103535, matching the geocoder); the
#   Judicial District courthouse at 70 Huntington Street is a separate building.
# - Danielson: town is in Killingly; geocoder labels it Danielson, Killingly.
# Coordinates are building-level, not survey-grade.
