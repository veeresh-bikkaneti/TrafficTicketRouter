# Rhode Island map pins — RI Traffic Tribunal (phase P5, MapLibre).
# Rhode Island has no county courts; the single statewide Traffic Tribunal in
# Cranston handles civil traffic offenses, so all five pins mark that one
# building — one pin per county for map filtering. The pin name is the
# tribunal's, never a "county courthouse": nothing here implies a county
# courthouse exists or that one building serves only one county.
# Address verified against the official tribunal page 2026-09-21; coordinates
# geocoded via Nominatim and cross-checked against the OSM address record.
# URL reused verbatim from data/states/RI.yaml — never invented.
pins:
