# New Hampshire map pins — Circuit Court District Division courthouses (50-state wave, 2026-09-21).
# All 10 counties pinned. Each pin marks the District Division courthouse that hears
# traffic matters for the county, using the representative venue from data/states/NH.yaml.
#
# Verification method, 2026-09-21:
# - curl to courts.nh.gov returns Akamai 403 (confirmed this pass: "Access Denied").
#   All live page fetches below were done through the browser text-fetch path.
# - LIVE-FETCHED (browser text fetch, expected official court content shown):
#   Coos: https://www.courts.nh.gov/your-visit/find-court/coos-county-district-divisions
#         (1st Circuit District Division - Lancaster: 55 School Street, Suite 201,
#         Lancaster, NH 03584);
#   Carroll: https://www.courts.nh.gov/your-visit/find-court/carroll-county-district-divisions
#         (3rd Circuit District Division - Ossipee: Carroll County Courthouse,
#         96 Water Village Road - Box 2, Ossipee, NH 03864);
#   https://www.courts.nh.gov/your-visit/find-court (Find a Court page, lists all
#   31 District Division courthouses and links to each per-county page).
# - Addresses for the other 8 counties verified in the official courts.nh.gov
#   "Circuit Court Address List" (2021-08) PDF plus official-site search content:
#   Concord's 32 Clinton Street confirmed on the official "Merrimack County District
#   Divisions" page; Brentwood's 10 Route 125 confirmed on the official "Rockingham
#   County District Divisions" page. No address or URL was invented.
# - A mid-pass browser_fetch failure for the Belknap county page (not retried per
#   safety rule) meant per-county pages were not re-fetched for the remaining 8
#   counties; their pin URLs reuse the live-verified Find a Court page instead of
#   assuming per-county URLs work.
# Omitted counties: none.
# Caveats:
# - Hillsborough has two District Division venues (Manchester and Nashua); the pin
#   is Manchester, the first representative venue in the state file. Nashua's venue
#   is 30 Spring Street, Suite 101, Nashua, NH 03060.
# - Grafton: pin address drops the "Box 10" mailing-box suffix from the official
#   address list; physical address shown.
# - Rockingham: geocoder matched the "Rockingham County Courthouse" building
#   (OSM access road "Autumn Lane"); official address 10 Route 125 kept per
#   courts.nh.gov.
# - Coordinates are building-level, not survey-grade.
# Do not commit without review.
