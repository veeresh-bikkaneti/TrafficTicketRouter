# Alabama map pins — county courthouses (phase P5, MapLibre).
#
# Verification (2026-09-21):
# - Addresses taken from official county court pages (county.alacourt.gov, the
#   Alabama Administrative Office of Courts' official county sites); Fayette from
#   the official county courthouse page; Dale from the Alabama SOS
#   city-county-lookup record for Dale County officials.
# - Every pin URL curl-verified HTTP 200 the same day (Fayette's official
#   courthouse page on HTTP now serves HTTPS; HTTPS URL used).
# - Coordinates geocoded via Nominatim (1+ s between requests), with cross-checks:
#   Nominatim display_name confirmed correct city/county/AL for each address hit;
#   10 pins use coordinates from the official site's own "Need Directions" map
#   link because Nominatim has no street-level record for those rural addresses
#   (Barbour, Butler, Clay, Coffee/Elba, Dale, Elmore, Henry, Pike, St. Clair;
#   Covington uses the Andalusia town centroid — approximate).
#
# Omissions: none — all 67 Alabama counties are represented.
#
# Caveats:
# - Multi-location counties; the pin marks the county-seat/main courthouse:
#   Barbour (Eufaula division: 405 East Barbour Street, Suite A119),
#   Coffee (Enterprise division: 101 S Edwards Street; pin is Elba),
#   Marshall (Albertville division: 133 South Emmett Street),
#   Jefferson (pin is Birmingham; a Bessemer division exists),
#   St. Clair (pin is the Ashville county-seat courthouse; a Pell City
#   division exists).
# - Dale: the official court site footer lists only PO Box 1350; the physical
#   address (100 E Court Square, Ozark) is from the Alabama SOS official lookup
#   for the Dale County Circuit Clerk's office; coordinates come from the
#   official site's own directions link (Google: "Dale County Circuit Court").
# - Pike: the official footer names "Pike County Judicial Complex,
#   1318 N Three Notch St." but the site's own directions map pins
#   120 W Church St, Troy; the pin uses the map-pinned address pending court
#   clarification.
# - Hosts used beyond the AL.yaml official_hosts allowlist need parent review:
#   alacourt.gov (all 66 court pins), fayetteco.net (Fayette courthouse page).
# Do not commit without review.
