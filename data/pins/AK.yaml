# Alaska map pins — trial-court courthouses serving all 30 boroughs/census areas
# (50-state wave, 2026-09-21).
# Alaska has no counties; traffic/minor-offense matters are heard in Alaska
# Court System trial courts. Area-to-court mapping follows the official
# Supreme Court Order 1870 venue map community chart (presumptive district
# court trial sites; https://courts.alaska.gov/sco/docs/sco1870leg.pdf).
# Street addresses are from each court's official directory page on
# courts.alaska.gov/courtdir/ — every page below was curl-verified to final
# HTTP 200 on 2026-09-21 (redirects followed). Coordinates via Nominatim with
# the official street address (User-Agent TicketRouter/1.0, 1 req/sec),
# cross-checked against city/state in the geocoder's display_name.
# Shared courthouses: Bethel serves Bethel + Kusilvak; Naknek serves
# Bristol Bay + Lake and Peninsula; Nenana serves Denali + Yukon-Koyukuk
# (Nenana is inside Yukon-Koyukuk CA); Valdez serves Valdez-Cordova + Chugach.
# No areas omitted — all 30 boroughs/census areas have a pin.
# Caveats:
# - Hoonah-Angoon is pinned at Angoon (700 Aandeinaatt Street): the Hoonah
#   court page lists only a mailing address (Box 430, Hoonah AK 99829), no
#   street address, so no building-level pin is possible there. Juneau is the
#   superior trial site for Hoonah-area matters per the venue map.
# - Town-level pins (no building-level geocoder match; official street
#   address retained, coordinates are town-level): Naknek, Sand Point,
#   Angoon, Kotzebue.
# - Tok pin is at 1313.4 Alaska Hwy, adjacent to the court's published
#   location at Mile 1313.5 Alaska Hwy.
# - Juneau ZIP 99801 and Skagway ZIP 99840 corroborated by the geocoder's
#   FULL_ADDRESS match (court pages show only mailing ZIPs / no ZIP).
# - Naknek ZIP 99633 and Sand Point ZIP 99661 are the towns' USPS ZIPs; the
#   court pages do not publish a ZIP for these locations.
# - Haines: the court's official mailing ZIP is 99827; Nominatim's record
#   for the same street shows 99840. Coordinates place the pin.
# - Dillingham: the geocoder record shows postcode "95576" (data typo) for
#   Emperor Way; the official ZIP 99576 is used.
# - Anchorage pin is the Nesbett Courthouse (825 W 4th Ave); the Boney
#   Courthouse (303 K Street) also houses Anchorage trial courts.
# - Kusilvak: Emmonak and Hooper Bay have in-area magistrate courts; the pin
#   uses Bethel, the full-service court and superior trial site for the
#   whole census area (district trial site for Hooper Bay/Chevak).
# - Kenai Peninsula: Homer and Seward also have trial courts; the pin is the
#   Kenai courthouse.
# - Southeast Fairbanks: Delta Junction also has a trial court; the pin is
#   Tok (venue-map trial site for most of the census area's communities).
# - Prince of Wales-Hyder: Metlakatla is served by Ketchikan per the venue
#   map; Kake has its own magistrate court. Pin is the Prince of Wales
#   (Klawock) court.
# - Nome Census Area: Unalakleet has its own trial court; the pin is Nome.
# - Bethel Census Area: Aniak has an in-area magistrate court; pin is Bethel.
# - North Slope: Point Hope is served by Kotzebue per the venue map; the pin
#   is Utqiagvik.
# - Aleutians East: Akutan is served by Unalaska; the pin is Sand Point.
# Coordinates are building-level where matched, town-level where noted —
# not survey-grade.
