# California map pins — county superior courthouses (50-state wave, 2026-09-21).
# Main courthouse street addresses verified on each county court's official
# site; coordinates are FULL_ADDRESS-level geocoder matches in
# the correct county, cross-checked against the official address. 48 pins reuse
# the verified card source_url from data/states/CA.yaml verbatim — never invented.
# 10 pins added 2026-09-21 (second pass): their sites were unreachable in the
# first wave but verified live on 2026-09-21 (curl HTTP 200, or page-text fetch
# where curl was bot-blocked). New official hosts (added to data/states/CA.yaml):
# lacourt.ca.gov, saccourt.ca.gov, sjcourts.org.
# Second-pass caveats:
# - Amador: www.amador.courts.ca.gov redirects to canonical amador.courts.ca.gov;
#   court also publishes matching coords on its own map listing.
# - Placer: curl blocked; site verified live via page-text fetch. Traffic heard
#   at Gibson Courthouse, 10820 Justice Center Drive, Roseville (Tahoe City
#   branch hears traffic too).
# - San Luis Obispo: traffic heard at the Grover Beach branch (214 S. 16th St),
#   not the main SLO courthouse (1050 Monterey St).
# - Los Angeles: Metropolitan Courthouse, 1945 S Hill St — the Central District
#   downtown traffic hub. Traffic is multi-branch (~16 courthouses per the
#   official directory); this pin is the central pick, not the only venue.
# - Riverside: pinned at Moreno Valley (13800 Heacock St, Bldg D), an officially
#   listed traffic venue. The Riverside Historic Courthouse (4050 Main St) handles
#   civil/probate, NOT traffic — do not use it. Other official traffic venues:
#   Banning, Blythe, Hemet, Indio (Larson Justice Center), Murrieta, Temecula.
# - Sacramento: Carol Miller Justice Center, 301 Bicentennial Circle — the
#   county's designated traffic courthouse (also small claims).
# - San Bernardino: pinned at Fontana District (17780 Arrow Blvd), where traffic
#   infractions are officially accepted. San Bernardino Justice Center
#   (247 W 3rd St) handles civil/criminal, NOT traffic. Also Barstow, Joshua Tree.
# - San Francisco: Civic Center Courthouse, Dept 218 (400 McAllister St) — all
#   traffic hearings moved here 2024-10-07; citations may still say to schedule
#   at Hall of Justice, 850 Bryant St.
# - San Joaquin: Stockton Courthouse traffic dept, 180 E. Weber Ave (Manteca and
#   Lodi branches also hear traffic).
# - Solano: Fairfield Hall of Justice, 600 Union Ave (Vallejo branch also
#   hears traffic).
# - Moreno Valley (Riverside) geocode is address-level; courthouse building is
#   not a distinct Nominatim POI — coordinates are approximate.
# Earlier caveats:
# - Siskiyou: current official court documents use 411 4th St, Yreka; the
#   Judicial Council court map and older brochures show 311 Fourth St. Pin uses
#   the current official address.
# - Napa: pin is the Historic Courthouse (main branch); the Criminal Courthouse
#   (1111 Third St, Napa) is separately listed and may hear traffic matters.
# - San Mateo: pin is the Central Branch (800 N Humboldt St, San Mateo); the
#   county seat is Redwood City (Southern Branch, 400 County Center).
# - Lake: court relocates to 675 Lakeport Blvd, Lakeport on 2026-09-28; update
#   this pin after the move (new ZIP not published on the court site).
# - Plumas: official page gives no ZIP; 95971 corroborated by the geocoder's
#   FULL_ADDRESS match.
# - Mendocino: new Ukiah courthouse under construction (began 2025); pin may
#   need updating when it opens.
# - Santa Barbara: court lists PO Box ZIP 93121-1107; geocoder matched the same
#   building at 1100 Anacapa St, 93101.
# Coordinates are building-level, not survey-grade.
