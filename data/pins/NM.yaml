# New Mexico courthouse map pins (50-state wave, 2026-09-21).
# One pin per county — all 33 counties covered; none omitted.
# Courts are NM magistrate courts (the courts that handle traffic citations)
# except Bernalillo County, which is served by the Bernalillo County
# Metropolitan Court. Where a county has multiple magistrate branches, the
# pin uses the county-seat/main branch (documented below).
# Addresses were taken from official nmcourts.gov pages on 2026-09-21:
# district location-hours-contacts pages, magistrate-judge directory pages,
# the Fifth Judicial District "Search Your Court" directory, and per-court
# pages (San Juan, McKinley) plus a Metropolitan Court document. Every pin URL
# below was live-verified on 2026-09-21: either curl returned final HTTP 200
# with real official court content, or a public page-text fetch exposed the
# expected official court content (several nmcourts.gov pages show a
# JavaScript verification splash to curl; the permitted fallback was used).
# Coordinates via Nominatim (User-Agent TicketRouter/1.0, ~1 req/sec), each
# checked against city/county/state in the geocoder's display_name.
# Caveats:
# - Town-level pins (no building-level geocoder match for the official
#   street address; official street address retained, coordinates are
#   town-level): Grants (Cibola), Raton (Colfax), Lordsburg (Hidalgo),
#   Deming (Luna), Gallup (McKinley), Mora (Mora), Moriarty (Torrance).
# - Street-level pins (geocoder returned the street, not the building):
#   Reserve (Catron — NM-12 is Main Street in Reserve), Ft Sumner
#   (De Baca), Roy (Harding).
# - Eddy: official text says "1949 Canal St."; Nominatim normalizes the
#   street to "South Canal Street" — same street, Carlsbad, Eddy County.
# - De Baca: official text uses "Ft Sumner"; geocoder normalizes to
#   "Fort Sumner".
# - Socorro: official ZIP is 87801; Nominatim's building record carries
#   87802 — same courthouse, Socorro, Socorro County.
# - Chaves: Nominatim's building record is labeled "Chavez County
#   Courthouse" (typo in OSM); its address components confirm Roswell,
#   Chaves County, NM 88201.
# - Lincoln/Rio Arriba: Nominatim labels the buildings "Lincoln County
#   Courthouse"/"Rio Arriba County Courthouse"; the magistrate courts are
#   housed in those buildings (300 Central Ave., Carrizozo; 7 Main St.,
#   Tierra Amarilla) per the official district pages.
# - Colfax: Raton Magistrate Court pinned (county seat); Springer branch
#   (15 Airport Road SW) not pinned. Dona Ana: Las Cruces branch pinned;
#   Anthony branch (100 Lincoln Blvd.) not pinned. Lea: Lovington branch
#   pinned (county seat); Hobbs and Eunice branches not pinned. Lincoln:
#   Carrizozo pinned (county seat); Ruidoso branch (101 Service Road) not
#   pinned. Rio Arriba: Tierra Amarilla pinned (county seat); Espanola
#   branch not pinned. San Juan: Aztec pinned (county seat); Farmington
#   branch (950 W. Apache St.) not pinned. Sandoval: Bernalillo branch
#   pinned; Cuba branch (6354 Highway 550) not pinned. Valencia: Belen
#   branch pinned; Los Lunas branch (1206 Main St. NE) not pinned. Grant:
#   Division I (Silver City) pinned; Division II (Bayard) not pinned.
# - Colfax address update: older sources showed 333 Savage Ave., Raton;
#   the official statewide directory and 8th District page now list
#   1413 South Second Street. Curry: older pages showed 221 Pile St.,
#   Clovis; official pages now list 700 N. Main St., Suite 5.
# - "Dona Ana" spelled without the tilde per data/states/NM.yaml county
#   spelling requirement.
