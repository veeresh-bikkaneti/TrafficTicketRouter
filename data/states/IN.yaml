  - id: in-mycase
    verification: link_ok
    verification_note: "GET https://mycase.in.gov/ -> 200 (no redirects)"
    source_url: "https://mycase.in.gov/"
    last_verified: "2026-09-21"
    kind: statewide_cms
    agency: Indiana Courts — MyCase public case search
    accepted_keys: Search by party name or case number on the official portal.
    cost: No cost to search — as of 2026-09-21 on mycase.in.gov.
    cost_free: true
    lag: null
    limitations:
      - Covers cases in Indiana trial courts that report to the portal.
      - Not searchable by driver’s license number.
    for_intents:
      - lost_paper
    for_counties:
      - '*'
    weight: 20
  - id: in-court-pay
    verification: link_ok
    verification_note: "GET https://publicaccess.courts.in.gov/pay -> 200 (no redirects)"
    source_url: "https://publicaccess.courts.in.gov/pay"
    last_verified: "2026-09-21"
    kind: pay_portal
    agency: Indiana Courts — online payment
    accepted_keys: Case or citation details on the official payment form.
    cost: The official payment page lists any processing details — as of 2026-09-21 on publicaccess.courts.in.gov.
    cost_free: false
    lag: null
    limitations:
      - Paying a ticket can be a plea of guilty or an admission — confirm on the official page before paying.
      - Not all citations are payable online.
    for_intents:
      - lost_paper
      - handle_it
    for_counties:
      - '*'
    weight: 30
