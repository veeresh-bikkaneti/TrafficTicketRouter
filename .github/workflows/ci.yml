# CI: validate data (states + pins), build compiled JSON, run tests, check official links.
# No deployment — this repo builds a static site; hosting is a separate decision.
name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate jurisdiction data
        run: node scripts/validate.mjs
      - name: Build compiled data
        run: node scripts/build-data.mjs
      - name: Build pin data
        run: node scripts/build-pins.mjs
      - name: Router tests
        run: node --test tests/router.test.mjs
      - name: Pin tests
        run: node --test tests/pins.test.mjs
      - name: Check official links
        run: node scripts/check-links.mjs
