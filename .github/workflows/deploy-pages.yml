# Deploy: build compiled site data, publish site/ to GitHub Pages on every master push.
name: deploy-pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate jurisdiction data
        run: node scripts/validate.mjs
      - name: Build compiled data
        run: |
          node scripts/build-data.mjs
          node scripts/build-pins.mjs
      - name: Router tests
        run: node --test tests/router.test.mjs
      - name: Pin tests
        run: node --test tests/pins.test.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
