# Pages: build the static site and deploy ./site to GitHub Pages on master.
# NOTE: the GitHub Pages *feature* (repo Settings > Pages > Source) is not
# enabled by this file — enabling it is a separate, explicit decision.
# Until it is enabled, this workflow's deploy job will fail gracefully.
name: pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate jurisdiction data
        run: node scripts/validate.mjs
      - name: Build compiled data
        run: node scripts/build-data.mjs
      - name: Build pin data
        run: node scripts/build-pins.mjs
      - name: Run tests
        run: node --test tests/router.test.mjs tests/pins.test.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
